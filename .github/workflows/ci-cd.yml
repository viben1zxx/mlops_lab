name: Enterprise MLOps CI
on: 
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 
          pip install ruff mypy bandit pytest-cov pytest-mock
          
      - name: Security & Linting Checks
        run: |
          ruff check .
          bandit -r . -c "bandit.yaml" --skip B101
          
      - name: Run Pytest with Coverage
        run: pytest --cov=. tests/
